<section class="vehicle-document-page">

    <header class="page-toolbar">
        <a 
            mat-button
            [routerLink]="vehicleId() ? ['/vehicles', vehicleId()] : ['/vehicles']"
            aria-label="Retour à la fiche véhicule">
            <mat-icon>arrow_back</mat-icon>
            Retour à la fiche véhicule
        </a>
    </header>

    @if (loading()) {
        <div class="page-state" aria-live="polite">
            <mat-spinner diameter="44"/>
            <p>Chargement du véhicule...</p>
        </div>
    } @else if (error()) {
        <div class="page-state error-state" role="alert">
            <mat-icon>error_outline</mat-icon>

            <div>
                <h1>Véhicule indisponible</h1>
                <p> {{ error() }} </p>
            </div>

            <a mat-stroked-button routerLink="/vehicles">
                Revenir à la liste
            </a>
        </div>
    } @else if (vehicle(); as currentVehicle) {
        <app-vehicle-page-header [vehicle]="currentVehicle" eyebrow="Dossier documentaire">
            <span
                vehicle-header-aside
                class="vehicle-status"
                [class.vehicle-status-active]="currentVehicle.vehicleStatus === 'ACTIVE'">
                {{ currentVehicle.vehicleStatus }}
            </span>
        </app-vehicle-page-header>

        @if (vehicleId(); as id) {
            <div class="document-sections">
                <app-owner-document-compliance 
                    [ownerType]="'VEHICLE'"
                    [ownerId]="id"
                    (addRequested)="addDocument($event)"
                    (viewRequested)="viewDocument($event)"
                    (replaceRequested)="replaceDocument($event)"
                />

                <app-owner-archived-document-list 
                    [ownerType]="'VEHICLE'"
                    [ownerId]="id"
                    (viewRequested)="viewArchivedDocument($event)"
                />
            </div>
        }
    }
    
</section>
