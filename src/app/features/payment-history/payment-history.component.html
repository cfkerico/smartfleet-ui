<mat-card class="payment-history-card">
    <mat-card-title>Historique des versements</mat-card-title>
</mat-card>

<table mat-table [dataSource]="dataSource" class="payment-table">
    
    <ng-container matColumnDef="paymentDate">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let payment">{{ payment.paymentDate }}</td>
    </ng-container>

    <ng-container matColumnDef="driver">
        <th mat-header-cell *matHeaderCellDef>Chauffeur</th>
        <td mat-cell *matCellDef="let payment">{{ payment.driverFullName }}</td>
    </ng-container>

    <ng-container matColumnDef="vehicle">
        <th mat-header-cell *matHeaderCellDef>Véhicule</th>
        <td mat-cell *matCellDef="let payment">{{ payment.vehicleLabel }}</td>
    </ng-container>

    <ng-container matColumnDef="expectedAmount">
        <th mat-header-cell *matHeaderCellDef>Attendu</th>
        <td mat-cell *matCellDef="let payment">{{ payment.expectedAmount }}</td>
    </ng-container>

    <ng-container matColumnDef="paidAmount">
        <th mat-header-cell *matHeaderCellDef>Versé</th>
        <td mat-cell *matCellDef="let payment">{{ payment.paidAmount }}</td>
    </ng-container>

    <ng-container matColumnDef="differenceAmount">
        <th mat-header-cell *matHeaderCellDef>Ecart</th>
        <td mat-cell *matCellDef="let payment">{{ payment.differenceAmount }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let payment">{{ payment.status }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

<mat-paginator [length]="totalElements"
               [pageSize]="pageSize"
               [pageIndex]="pageIndex"
               [pageSizeOptions]="[5, 10, 20]"
               (page)="onPageChange($event)">
</mat-paginator>
