<h1>Drivers</h1>

    <button mat-raised-button color="primary" (click)="openForm()">
      Ajouter
    </button>

    <mat-form-field appearance="outline" class="filter">
      <mat-label>Filtrer</mat-label>

      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Recherche..."
      >
    </mat-form-field>

    <table mat-table [dataSource]="drivers">

      <ng-container matColumnDef="civilite">
        <th mat-header-cell *matHeaderCellDef>Civilité</th>
        <td mat-cell *matCellDef="let d">{{ d.civilite }}</td>
      </ng-container>

      <ng-container matColumnDef="nom">
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let d">{{ d.nom }}</td>
      </ng-container>

      <ng-container matColumnDef="prenom">
        <th mat-header-cell *matHeaderCellDef>Prenom</th>
        <td mat-cell *matCellDef="let d">{{ d.prenom }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let d">{{ d.email }}</td>
      </ng-container>

      <ng-container matColumnDef="mobilePhoneNumber">
        <th mat-header-cell *matHeaderCellDef>mobilePhoneNumber</th>
        <td mat-cell *matCellDef="let d">{{ d.mobilePhoneNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="adresse">
        <th mat-header-cell *matHeaderCellDef>adresse</th>
        <td mat-cell *matCellDef="let d">{{ d.adresse }}</td>
      </ng-container>

      <ng-container matColumnDef="workedDays">
        <th mat-header-cell *matHeaderCellDef>workedDays</th>
        <td mat-cell *matCellDef="let d">{{ d.workedDays }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let d">
          <button mat-button color="accent"
                  (click)="analyse(d.id!)">
            <mat-icon>Analyse IA</mat-icon>
          </button>

          <button
            mat-button
            color="primary"
            (click)="edit(d)">
            <mat-icon>edit</mat-icon>
          </button>

          <button
            mat-button
            color="warn"
            (click)="delete(d)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>

    </table>

  <mat-paginator
    [length]="totalElements"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)">
  </mat-paginator>
