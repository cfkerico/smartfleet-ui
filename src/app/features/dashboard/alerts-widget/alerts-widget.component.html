<div class="alert-widget">

  <!--  HEADER  -->
  <div class="widget-header">
    <h2>Notifications non lues</h2>
    <span class="counter">{{ notifications.length }}</span>
  </div>

  <!--  EMPTY -->
  @if (notifications.length === 0) {
    <div class="empty-state">
      <mat-icon>notification_off</mat-icon>
      <span>Aucune notification non lue</span>
    </div>
  }

  <!--  LIST  -->
  @for (notification of notifications; track notification.id) {
    <div class="alert-card"
         [class.info]="notification.severity === 'INFO'"
         [class.success]="notification.severity === 'SUCCESS'"
         [class.warning]="notification.severity === 'WARNING'"
         [class.error]="notification.severity === 'ERROR'">
      <!--  ICON  -->
      <div class="alert-icon">
        <mat-icon>{{ getIcon(notification.severity) }}</mat-icon>
      </div>

      <!--  CONTENT -->
      <div class="alert-content">
        <div class="alert-type">{{ notification.title }}</div>
        <div class="alert-message">{{ notification.message }}</div>
      </div>
    </div>

  }

</div>
