<header class="header">

  <!-- LEFT -->
  <div class="header-left">

    <button mat-icon-button class="menu-btn" (click)="toggleSidebar()">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="page-title">
    Dashboard
  </span>
  </div>

  <!--  CENTER  -->
  <div class="header-center">
    <mat-form-field appearance="outline" class="search-field">
      <mat-icon matPrefix>
        search
      </mat-icon>
      <input matInput placeholder="Search...">
    </mat-form-field>
  </div>

  <!--  RIGHT -->
  <div class="header-right">
    <button mat-icon-button [matMenuTriggerFor]="notificationMenu">

      <mat-icon [matBadge]="notificationStore.unreadCount()"
                [matBadgeHidden]="notificationStore.unreadCount() === 0"
                matBadgeColor="warn">
        notifications
      </mat-icon>
    </button>

    <mat-menu #notificationMenu="matMenu">
      @if (notificationStore.notifications().length === 0) {
        <button mat-menu-item disabled>
          Aucune notification
        </button>
      } @else {
        @for (
          notification of notificationStore.notifications(); track notification.id
          ) {
          <button mat-menu-item (click)="markAsRead(notification)">
            <div class="notification-item">
              <strong>{{ notification.title }}</strong>
              <br>
              <span>{{ notification.message }}</span>
            </div>

          </button>
        }
      }
    </mat-menu>

    <button mat-button class="profile-btn" [matMenuTriggerFor]="profileMenu"
            aria-label="Ouvrir le menu du profil">
      <mat-icon>
        account_circle
      </mat-icon>

      <span class="profile-name">{{ profileName }}</span>
      <mat-icon>expand_more</mat-icon>
    </button>

    <mat-menu #profileMenu="matMenu">
      <div class="profile-summary">
        <strong>{{ profileName }}</strong>
        @if (profileUsername) {
          <span>{{ profileUsername }}</span>
        }
        @if (profileEmail) {
          <span>{{ profileEmail }}</span>
        }
      </div>
      <mat-divider />
      <button mat-menu-item class="logout-button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Se déconnecter</span>
      </button>
    </mat-menu>
  </div>

</header>
