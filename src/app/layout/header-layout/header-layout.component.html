<header class="header">

  <!-- LEFT -->
  <div class="header-left">

    <button mat-icon-button class="menu-btn" (click)="toggleSidebar()">
      <mat-icon>menu</mat-icon>
    </button>

    <span class="page-title">
    Dashboard
  </span>
  </div>

  <!--  CENTER  -->
  <div class="header-center">
    <mat-form-field appearance="outline" class="search-field">
      <mat-icon matPrefix>
        search
      </mat-icon>
      <input matInput placeholder="Search...">
    </mat-form-field>
  </div>

  <!--  RIGHT -->
  <div class="header-right">
    <button mat-icon-button [matMenuTriggerFor]="notificationMenu">

      <mat-icon [matBadge]="notificationStore.unreadCount()"
                [matBadgeHidden]="notificationStore.unreadCount() === 0"
                matBadgeColor="warn">
        notifications
      </mat-icon>
    </button>

    <mat-menu #notificationMenu="matMenu">
      @if (notificationStore.notifications().length === 0) {
        <button mat-menu-item disabled>
          Aucune notification
        </button>
      } @else {
        @for (
          notification of notificationStore.notifications(); track notification.id
          ) {
          <button mat-menu-item (click)="markAsRead(notification)">
            <div class="notification-item">
              <strong>{{ notification.title }}</strong>
              <span>{{ notification.message }}</span>
            </div>

          </button>
        }
      }
    </mat-menu>

    <button mat-button class="profile-btn">
      <mat-icon>
        account_circle
      </mat-icon>

      <span>CHOUPO</span>
    </button>
  </div>

</header>
